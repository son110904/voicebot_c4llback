# Campaign rules
utc_offset_hours: 7            # giờ Việt Nam, không có giờ mùa hè
docs_min_gap_minutes: 5      # docs: các lần gọi cách nhau >= 5 phút
rolling_window_hours: 24       # đếm lượt theo 24h trượt
per_phone_cap_24h: 5           # tổng số cuộc tới 1 số ĐT trong 24h, cộng mọi case
dtv_recheck_minutes: 5         # không có ĐTV online -> hoãn gọi, thử lại sau n phút
llm_min_confidence: 0.7        # nhãn LLM dưới ngưỡng -> coi là 'unclear' -> chuyển ĐTV

# Caller ID cố định cho mọi cuộc gọi outbound. Yêu cầu bên tổng đài cấu hình hiển thị số này.
# KH thấy số này trong màn hình gọi đến -> hiển thị "VietinBank" nếu đã lưu, bớt khả năng tắt máy ngay.
hotline: "1900558868"

# Pre-notification: gửi push qua iPay TRƯỚC khi bot gọi, để KH biết số sắp gọi là của ngân hàng.
# Nếu bỏ qua được qua app (KH xác thực luôn trên iPay) thì khỏi gọi.
pre_call:
  push_lead_minutes: 5         # push iPay bao lâu trước cuộc gọi đầu tiên (P2/P3). P1 bỏ qua delay.
  short_hangup_max_per_case: 2 # KH tắt máy sớm (< 5s) tối đa n lần. Lần n+1 không gọi nữa, chỉ ZNS + ĐTV.

alt_phone:                     # số dự phòng
  switch_after_failures: 2
  max_attempts: 1

system_retry:                  # lỗi phía hệ thống - KHÔNG tính lượt
  max_in_a_row: 3              # quá ngưỡng: P1 chuyển ĐTV, P2/P3 chỉ backoff (không có người KTV để báo động)
  backoff_minutes: 30

appointment:
  default_minutes: 60          # KH nói "gọi lại sau" mà không nói giờ

urgency:
  large_amount_vnd: 50000000   # GIẢ ĐỊNH - cần nghiệp vụ xác nhận
  multi_alert_count: 2         # >= 2 cảnh báo cho cùng thẻ/KH -> P1

levels:
  P1:                          # thẻ còn mở + GD được cấp phép / số tiền lớn / nhiều cảnh báo
    max_calls_24h: 3           # giảm từ 5 xuống 3 — chuẩn FCC (3 lần/3 ngày); VN chưa có quy định rõ nhưng tránh quấy rối KH
    min_gap_minutes: 5
    window: "00:00-24:00"
    max_days: 1
    zns_after_failures: 1      # gửi ZNS ngay sau lần gọi hụt đầu tiên
    appointment_max_wait_minutes: 30
    max_appointments: 2
  P2:                          # thẻ đã bị khóa tự động
    max_calls_24h: 3
    min_gap_minutes: 10
    window: "07:00-22:00"
    max_days: 2
    zns_after_failures: 2
    appointment_max_wait_minutes: 1440
    max_appointments: 2
  P3:                          # GD đã bị từ chối, thẻ chưa khóa
    max_calls_24h: 3
    min_gap_minutes: 30
    window: "08:00-21:00"
    max_days: 1
    zns_after_failures: 2
    appointment_max_wait_minutes: 1440
    max_appointments: 2

# Khoảng chờ trước khi gọi lại, theo kết quả cuộc gọi.
# Luôn bị nâng lên tối thiểu min_gap_minutes của mức khẩn.
outcomes:
  no_answer:             {delays: [10, 30, 60]}
  busy:                  {delays: [10]}
  rejected:              {delays: [15], zns_before: true}        # KH bấm từ chối: ZNS trước
  unreachable:           {delays: [30, 60]}
  voicemail:             {delays: [10]}
  short_hangup:          {delays: [10], zns_before: true}        # tắt máy sớm -> gửi ZNS ngay (KH nghĩ là số lạ)
  relative_answered:     {delays: [30, 60]}
  scam_suspected_hangup: {delays: [60], zns_before: true, max_per_case: 1}
  dropped:               {delays: [10]}
  system_error:          {delays: [2]}
  bad_audio:             {delays: [10]}

# Kênh phụ: Zalo ZNS thay cho SMS (bank chưa cấp SMS gateway cho dự án này).
# ZNS yêu cầu template được Zalo duyệt trước khi deploy thật -> submit mẫu riêng cho PRODUCTION.
# QUAN TRỌNG: Zalo có thể từ chối duyệt template chứa SĐT dạng text.
# Khi submit template lên Zalo: dùng CTA button thay vì ghi SĐT trong nội dung:
#   - Nút "Gọi hotline" → tel:1900558868
#   - Nút "Mở iPay"     → deep link app VietinBank iPay (xác nhận với team iPay)
zns:
  max_per_case: 3
  templates:                   # KHÔNG được chứa chi tiết giao dịch - code chặn dấu { }
    pre_call: "VietinBank sắp gọi anh/chị trong 5 phút về giao dịch thẻ cần xác thực. Hoặc anh/chị có thể mở app VietinBank iPay để tự xác thực nhanh."
    contact: "VietinBank đã cố liên hệ anh/chị về giao dịch thẻ cần xác thực. Vui lòng mở app VietinBank iPay để xác thực, hoặc bấm nút bên dưới để gọi hotline."
    final: "VietinBank không liên hệ được anh/chị về giao dịch thẻ. Vui lòng mở app VietinBank iPay hoặc bấm nút bên dưới để được hỗ trợ."

# Opt-out: chuẩn quốc tế (TCPA/FCC) yêu cầu cuộc gọi tự động phải cho KH chọn
# dừng nhận cuộc gọi hoặc chuyển người thật ngay từ đầu cuộc gọi.
# Bot PHẢI đọc câu opt-out này SAU khi xác thực danh tính KH, TRƯỚC khi vào nội dung xác thực GD.
# Khi KH chọn opt-out: LLM gán nhãn DO_NOT_CALL hoặc NEED_HUMAN -> rule engine xử lý tương ứng.
call_script:
  opt_out_prompt: "Nếu anh/chị không muốn nhận cuộc gọi tự động, vui lòng nói 'chuyển người thật' hoặc bấm phím 0 để được kết nối với nhân viên."
